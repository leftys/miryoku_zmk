name: 'totem seeeduino_xiao_ble'
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["totem_left","totem_right"]'
      branches: '["zmkfirmware/zmk/v0.3"]'
      kconfig: '["CONFIG_ZMK_POINTING=y\nCONFIG_ZMK_SLEEP=y\nCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000\nCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y\nCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y"]'
      # CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y\nCONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
