name: 'totem nice_nano nice_view'
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["totem_left nice_view_adapter nice_view","totem_right nice_view_adapter nice_view"]'
      branches: '["zmkfirmware/zmk/v0.3"]'
      kconfig: '["CONFIG_ZMK_POINTING=y","CONFIG_VIAL=y","CONFIG_VIAL_ENABLE=y","CONFIG_VIAL_KEYBOARD_UID=0x544F54454D"]'
