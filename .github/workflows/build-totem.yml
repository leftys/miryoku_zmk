name: 'totem seeeduino_xiao_ble'
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["totem_left","totem_right"]'
      branches: '["zmkfirmware/zmk/v0.3"]'
      kconfig: >-
        ["CONFIG_ZMK_POINTING=y\n
        CONFIG_ZMK_SLEEP=y\n
        CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000\n
        CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y\n
        CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y\n
        CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y\n
        CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6\n
        CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12\n
        CONFIG_BT_PERIPHERAL_PREF_LATENCY=0\n
        CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y\n
        CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600"]
