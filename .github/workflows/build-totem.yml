name: 'totem seeduino_xiao'
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao"]'
      shield: '["totem_left","totem_right"]'
      branches: '["zmkfirmware/zmk/v0.3"]'
      kconfig: '["CONFIG_ZMK_POINTING=y"]'
